[package]
name = "asteria-agent"
version = "0.1.0"
edition = "2024"
default-run = "asteria-agent"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
chrono = "0.4"
dotenvy = "0.15"
meval = "0.2"
reqwest = { version = "0.12", features = ["json"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
reedline = { version = "0.51", default-features = false, features = ["external_printer"] }
